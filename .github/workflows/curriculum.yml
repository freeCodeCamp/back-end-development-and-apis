name: Curriculum

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --junit=curriculum-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-test-results
          path: curriculum-results.xml
          if-no-files-found: ignore
