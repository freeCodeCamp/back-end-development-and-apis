name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Release Please uses tags to find the previous release. Keep that state
      # without creating GitHub Releases or publishing a package.
      - name: Tag current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node --print "require('./package.json').version")"
          tag="v$version"

          # Release Please keys release detection off the release PR's merge
          # commit SHA, so that is what must be tagged - not whichever commit
          # happens to contain the package.json diff. A squash merge makes
          # those the same commit, but a merge commit does not, so look up
          # the actual merge commit first and only fall back to the pickaxe
          # search when no matching merged release PR is found.
          release_commit="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --search "\"chore(main): release $version\" in:title" \
            --json title,mergeCommit \
            --jq "[.[] | select(.title == \"chore(main): release $version\")][0].mergeCommit.oid")"

          if [ -z "$release_commit" ]; then
            version_line="\"version\": \"$version\""
            release_commit="$(git log -1 --format=%H -S "$version_line" -- package.json)"
          fi

          remote_commit="$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)"

          if [ -z "$remote_commit" ]; then
            remote_commit="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          fi

          if [ "$remote_commit" != "$release_commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --force --annotate "$tag" --message "Release $tag" "$release_commit"
            git push --force origin "refs/tags/$tag"
          fi

      - name: Open or update release PR
        id: release
        # v5.0.0
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          release-type: node
          skip-github-release: true

      # Node releases normally update package-lock.json and CHANGELOG.md too.
      # This repository's release signal is exclusively package.json#version.
      - name: Keep only package.json version change
        if: steps.release.outputs.pr != ''
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(node --input-type=module --eval "console.log(JSON.parse(process.env.RELEASE_PR).headBranchName)")"
          git fetch origin "refs/heads/$branch"
          git checkout --force -B "$branch" FETCH_HEAD

          while IFS= read -r -d '' file; do
            if [ "$file" = package.json ]; then
              continue
            fi

            if git cat-file -e "origin/main:$file" 2>/dev/null; then
              git checkout origin/main -- "$file"
            else
              git rm --force --ignore-unmatch -- "$file"
            fi
          done < <(git diff --name-only --null origin/main...HEAD)

          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: keep release version-only"
          git push origin "HEAD:$branch"
